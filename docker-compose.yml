services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: fai-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  watchdog:
    image: willfarrell/autoheal:latest
    container_name: fai-watchdog
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  mbusd:
    image: alpine:latest
    container_name: fai-mbusd
    restart: unless-stopped
    devices:
      - "/dev/serial/by-id/usb-WCH.CN_USB_Quad_Serial_BD65C4ABCD-if00:/dev/ttyACM_METER"
    command: >
      /bin/sh -c "
      if ! command -v mbusd > /dev/null; then
        echo 'Compiling mbusd natively for ARM64...' &&
        apk add --no-cache git cmake build-base linux-headers pkgconf bash &&
        git clone https://github.com/3cky/mbusd.git /tmp/mbusd &&
        cd /tmp/mbusd && mkdir build && cd build &&
        cmake -DCMAKE_INSTALL_PREFIX=/usr .. && make && make install &&
        rm -rf /tmp/mbusd;
      fi;
      echo 'Starting Modbus Gateway...' &&
      exec mbusd -d -p /dev/ttyACM_METER -s 9600 -m 8N1 -P 5020 -t 2000"
    ports:
      - "5020:5020"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5020 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nodered:
    image: nodered/node-red:latest
    container_name: fai-nodered
    restart: unless-stopped
    devices:
      - "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_B401GJOW-if00-port0:/dev/ttyUSB1"  # Tinymesh USB
      - "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_B400T7S7-if00-port0:/dev/ttyUSB0"  # WMBUS USB
    group_add:
      - "46" 
    volumes:
      - ./node-red-data:/data
    environment:
      - NODE_RED_ENABLE_SAFE_MODE=false
      - TZ=UTC
      - GATEWAY_SERIAL=${GATEWAY_SERIAL}
      - GATEWAY_HOSTNAME=${GATEWAY_HOSTNAME}
      - POWER_METER_TYPE=${POWER_METER_TYPE}
    ports:
      - "1880:1880"
    depends_on:
      - mqtt
      - mbusd
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:1880/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3