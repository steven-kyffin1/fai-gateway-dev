services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: fai-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - /opt/fai-storage:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  watchdog:
    image: willfarrell/autoheal:latest
    container_name: fai-watchdog
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=2
      - AUTOHEAL_START_PERIOD=30
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ups-watchdog:
      build:
        context: .
        dockerfile: ups-watchdog/Dockerfile
      container_name: ups-watchdog
      restart: always
      privileged: true
      environment:
        - BUS_NUMBER=6
        - LTC_ADDRESS=0x09
        - LTC_STATUS_REGISTER=0x1C
        - LTC_SWAP_BYTES=true
        - UPS_TRIGGER_SECONDS=5
        - UPS_WAKE_SECONDS=60
      volumes:
        - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      devices:
        - "/dev/i2c-6:/dev/i2c-6"
      healthcheck:
        test: ["CMD", "python", "/app/healthcheck.py"]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 15s

  # ==========================================
  # RS-485 MODBUS SERVICES (WAVESHARE ISOLATED TWO-CHANNEL CONVERTER)
  # ==========================================

  # ── Channel 1: power meters ──
  mbusd:
      build: ./mbusd
      container_name: fai-mbusd
      restart: unless-stopped
      devices:
        - /dev/RS485_ISO_1:/dev/RS485_ISO_1
      environment:
        - RS485_PORT=/dev/RS485_ISO_1
        - RS485_BAUD=9600
        - MBUSD_TCP_PORT=5020
      ports:
        - "5020:5020"
      healthcheck:
        test: ["CMD-SHELL", "nc -z 127.0.0.1 5020 || exit 1"]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 15s

  # ── Channel 2: shared silo bus (silo 1 = unit 1, silo 2 = unit 2) ──
  mbusd-silo:
      build: ./mbusd
      container_name: fai-mbusd-silo
      restart: unless-stopped
      devices:
        - /dev/RS485_ISO_2:/dev/RS485_ISO_2
      environment:
        - RS485_PORT=/dev/RS485_ISO_2
        - RS485_BAUD=19200
        - MBUSD_TCP_PORT=5021
      ports:
        - "5021:5021"
      healthcheck:
        test: ["CMD-SHELL", "nc -z 127.0.0.1 5021 || exit 1"]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 15s

  # ==========================================
  # NODE-RED EDGE ENGINE
  # ==========================================
  nodered:
      build: ./nodered-build
      container_name: fai-nodered
      restart: unless-stopped
      privileged: true
      group_add:
        - "46" 
      volumes:
        - ./node-red-data:/data
        - /dev:/dev 
        - /dev/serial:/dev/serial
      env_file:
        - .env
      environment:
        - NODE_RED_ENABLE_SAFE_MODE=false
        - TZ=UTC
        - GATEWAY_SERIAL=${GATEWAY_SERIAL}
        - GATEWAY_HOSTNAME=${GATEWAY_HOSTNAME}
        - POWER_METER_TYPE=${POWER_METER_TYPE}
        - EMC_TEST_MODE=${EMC_TEST_MODE:-false}
        - NODE_RED_HEALTH_STALE_SECONDS=${NODE_RED_HEALTH_STALE_SECONDS:-25}
        - NODE_RED_HEALTH_STARTUP_GRACE_SECONDS=${NODE_RED_HEALTH_STARTUP_GRACE_SECONDS:-30}
      ports:
        - "1880:1880"
      depends_on:
        mqtt:
          condition: service_healthy
        mbusd:
          condition: service_started 
        mbusd-silo:
          condition: service_started
      healthcheck:
        test:
          - CMD
          - node
          - -e
          - >-
            require('http').get('http://127.0.0.1:1880/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
        interval: 5s
        timeout: 3s
        retries: 2
        start_period: 30s

  # ==========================================
  # LORAWAN OFFLINE STACK (CHIRPSTACK)
  # ==========================================
  lora-forwarder:
    image: rakwireless/udp-packet-forwarder:latest
    profiles: ["lorawan"]
    container_name: lora-forwarder
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev
    environment:
      - MODEL=SX1302
      - INTERFACE=USB
      - DEVICE=/dev/ttyACM0
      - GATEWAY_EUI=${GATEWAY_SERIAL}
      - SERVER_HOST=gateway-bridge
      - SERVER_PORT=1700
      - FREQ_BAND=EU868

  gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    profiles: ["lorawan"]
    container_name: gateway-bridge
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__SERVER=tcp://mqtt:1883
    depends_on:
      - mqtt

  chirpstack-postgres:
    image: postgres:14-alpine
    profiles: ["lorawan"]
    container_name: chirpstack-postgres
    restart: unless-stopped
    volumes:
      - ./chirpstack/postgres:/var/lib/postgresql/data
      - ./chirpstack/postgres-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres

  chirpstack-redis:
    image: redis:7-alpine
    profiles: ["lorawan"]
    container_name: chirpstack-redis
    restart: unless-stopped
    volumes:
      - ./chirpstack/redis:/data
    command: redis-server --save 300 1 --appendonly yes

  chirpstack:
    image: chirpstack/chirpstack:4
    profiles: ["lorawan"]
    container_name: chirpstack
    restart: unless-stopped
    command: -c /etc/chirpstack
    volumes:
      - ./chirpstack/configuration/chirpstack:/etc/chirpstack
    ports:
      - "8080:8080" 
    depends_on:
      - chirpstack-postgres
      - chirpstack-redis
      - mqtt

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    profiles: ["lorawan"]
    container_name: chirpstack-rest-api
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack

