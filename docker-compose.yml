services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: fai-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - /opt/fai-storage:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  watchdog:
    image: willfarrell/autoheal:latest
    container_name: fai-watchdog
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ups-watchdog:
      image: python:3.9-slim
      container_name: ups-watchdog
      restart: always
      privileged: true 
      volumes:
        - ./scripts/ups_watchdog.py:/app/ups_watchdog.py:ro # 'ro' ensures the container cannot modify your host script.
        - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket 
      devices:
        - "/dev/i2c-6:/dev/i2c-6" 
      # Automatically install the I2C library and DBUS tool before running the script
      command: >
        sh -c "apt-get update && apt-get install -y dbus && 
        pip install smbus2 && 
        python -u /app/ups_watchdog.py"

  mbusd:
      build: ./mbusd
      container_name: fai-mbusd
      restart: unless-stopped
      privileged: true
      volumes:
        - /dev:/dev  # The magic hot-plugging soft-mount
      environment:
        # ZERO-TOUCH UPGRADE: Uses your Bootstrap udev rule instead of a hardcoded silicon ID
        - RS485_PORT=/dev/RS485_QUAD_1     
      ports:
        - "5020:5020"
      healthcheck:
        test: ["CMD-SHELL", "netstat -ln | grep 5020 || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s

  nodered:
      build: ./nodered-build
      container_name: fai-nodered
      restart: unless-stopped
      privileged: true
      group_add:
        - "46"  # Critical: Grants Node-RED access to the USB radios
      volumes:
        - ./node-red-data:/data
        - /dev:/dev  # The magic hot-plugging soft-mount
        - /dev/serial:/dev/serial
      env_file:
        - .env  # This forces Docker to load the file
      environment:
        - NODE_RED_ENABLE_SAFE_MODE=false
        - TZ=UTC
        - GATEWAY_SERIAL=${GATEWAY_SERIAL}
        - GATEWAY_HOSTNAME=${GATEWAY_HOSTNAME}
        - POWER_METER_TYPE=${POWER_METER_TYPE}
      ports:
        - "1880:1880"
      depends_on:
        mqtt:
          condition: service_started
        mbusd:
          condition: service_started  # Loosened so Node-RED boots even if Modbus is unplugged!
      healthcheck:
        test: ["CMD-SHELL", "wget -q --spider http://localhost:1880/ || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3

  # ==========================================
  # LORAWAN OFFLINE STACK (CHIRPSTACK)
  # ==========================================
  lora-forwarder:
    image: rakwireless/udp-packet-forwarder:latest
    profiles: ["lorawan"]
    container_name: lora-forwarder
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev  # Soft-mounts the /dev/ttyACM0 radio
    environment:
      - MODEL=SX1302
      - INTERFACE=USB
      - DEVICE=/dev/ttyACM0
      - GATEWAY_EUI=${GATEWAY_SERIAL}
      - SERVER_HOST=gateway-bridge
      - SERVER_PORT=1700
      - FREQ_BAND=EU868

  gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    profiles: ["lorawan"]
    container_name: gateway-bridge
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__SERVER=tcp://mqtt:1883
    depends_on:
      - mqtt

  chirpstack-postgres:
    image: postgres:14-alpine
    profiles: ["lorawan"]
    container_name: chirpstack-postgres
    restart: unless-stopped
    volumes:
      - ./chirpstack/postgres:/var/lib/postgresql/data
      - ./chirpstack/postgres-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres

  chirpstack-redis:
    image: redis:7-alpine
    profiles: ["lorawan"]
    container_name: chirpstack-redis
    restart: unless-stopped
    volumes:
      - ./chirpstack/redis:/data
    command: redis-server --save 300 1 --appendonly yes

  chirpstack:
    image: chirpstack/chirpstack:4
    profiles: ["lorawan"]
    container_name: chirpstack
    restart: unless-stopped
    command: -c /etc/chirpstack
    volumes:
      - ./chirpstack/configuration/chirpstack:/etc/chirpstack
    ports:
      - "8080:8080" # The Web Dashboard
    depends_on:
      - chirpstack-postgres
      - chirpstack-redis
      - mqtt

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    profiles: ["lorawan"]
    container_name: chirpstack-rest-api
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack