services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: fai-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - /opt/fai-storage:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  watchdog:
    image: willfarrell/autoheal:latest
    container_name: fai-watchdog
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ups-watchdog:
      image: python:3.9-slim
      container_name: ups-watchdog
      restart: always
      privileged: true 
      volumes:
        - ./scripts/ups_watchdog.py:/app/ups_watchdog.py:ro
        - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket 
      devices:
        - "/dev/i2c-6:/dev/i2c-6" 
      command: >
        sh -c "apt-get update && apt-get install -y dbus && 
        pip install smbus2 && 
        python -u /app/ups_watchdog.py"

  # ==========================================
  # RS-485 MODBUS SERVICES (USB QUAD HUB)
  # ==========================================

  # ── 1. Power Meters (Hub Port 1) ──
  mbusd:
      build: ./mbusd
      container_name: fai-mbusd
      restart: unless-stopped
      privileged: true
      volumes:
        - /dev:/dev
      environment:
        - RS485_PORT=/dev/RS485_QUAD_1  
        #- RS485_PORT=/dev/ttyACM1   
      ports:
        - "5020:5020"
      healthcheck:
        # FIXED: Alpine natively supports 'nc -z' for TCP port checking
        test: ["CMD-SHELL", "nc -z 127.0.0.1 5020 || exit 1"]
        interval: 60s
        timeout: 30s
        retries: 3
        start_period: 15s

  # ── 2. Silo Junction Box 1 (Hub Port 3) ──
  mbusd-weight-3:
      build: ./mbusd
      container_name: fai-mbusd-weight-3
      restart: unless-stopped
      privileged: true
      volumes:
        - /dev:/dev
      # FIXED: Removed the invalid '-t 2000' syntax
      #command: sh -c "mbusd -d -p /dev/ttyACM3 -s 19200 -m 8N1 -P 5021"
      command: sh -c "mbusd -d -p /dev/RS485_QUAD_3 -s 19200 -m 8N1 -P 5021"
      ports:
        - "5021:5021"
      healthcheck:
        test: ["CMD-SHELL", "nc -z 127.0.0.1 5021 || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s

  # ── 3. Silo Junction Box 2 (Hub Port 4) ──
  mbusd-weight-4:
      build: ./mbusd
      container_name: fai-mbusd-weight-4
      restart: unless-stopped
      privileged: true
      volumes:
        - /dev:/dev
      # FIXED: Removed the invalid '-t 2000' syntax
      #command: sh -c "mbusd -d -p /dev/ttyACM4 -s 19200 -m 8N1 -P 5022"
      command: sh -c "mbusd -d -p /dev/RS485_QUAD_4 -s 19200 -m 8N1 -P 5022"
      ports:
        - "5022:5022"
      healthcheck:
        test: ["CMD-SHELL", "nc -z 127.0.0.1 5022 || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s

  # ==========================================
  # NODE-RED EDGE ENGINE
  # ==========================================
  nodered:
      build: ./nodered-build
      container_name: fai-nodered
      restart: unless-stopped
      privileged: true
      group_add:
        - "46" 
      volumes:
        - ./node-red-data:/data
        - /dev:/dev 
        - /dev/serial:/dev/serial
      env_file:
        - .env
      environment:
        - NODE_RED_ENABLE_SAFE_MODE=false
        - TZ=UTC
        - GATEWAY_SERIAL=${GATEWAY_SERIAL}
        - GATEWAY_HOSTNAME=${GATEWAY_HOSTNAME}
        - POWER_METER_TYPE=${POWER_METER_TYPE}
      ports:
        - "1880:1880"
      depends_on:
        mqtt:
          condition: service_started
        mbusd:
          condition: service_started 
        mbusd-weight-3:
          condition: service_started
        mbusd-weight-4:
          condition: service_started
      healthcheck:
        test: ["CMD-SHELL", "wget -q --spider http://localhost:1880/ || exit 1"]
        interval: 60s
        timeout: 30s
        retries: 3

  # ==========================================
  # LORAWAN OFFLINE STACK (CHIRPSTACK)
  # ==========================================
  lora-forwarder:
    image: rakwireless/udp-packet-forwarder:latest
    profiles: ["lorawan"]
    container_name: lora-forwarder
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev
    environment:
      - MODEL=SX1302
      - INTERFACE=USB
      - DEVICE=/dev/ttyACM0
      - GATEWAY_EUI=${GATEWAY_SERIAL}
      - SERVER_HOST=gateway-bridge
      - SERVER_PORT=1700
      - FREQ_BAND=EU868

  gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    profiles: ["lorawan"]
    container_name: gateway-bridge
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__SERVER=tcp://mqtt:1883
    depends_on:
      - mqtt

  chirpstack-postgres:
    image: postgres:14-alpine
    profiles: ["lorawan"]
    container_name: chirpstack-postgres
    restart: unless-stopped
    volumes:
      - ./chirpstack/postgres:/var/lib/postgresql/data
      - ./chirpstack/postgres-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres

  chirpstack-redis:
    image: redis:7-alpine
    profiles: ["lorawan"]
    container_name: chirpstack-redis
    restart: unless-stopped
    volumes:
      - ./chirpstack/redis:/data
    command: redis-server --save 300 1 --appendonly yes

  chirpstack:
    image: chirpstack/chirpstack:4
    profiles: ["lorawan"]
    container_name: chirpstack
    restart: unless-stopped
    command: -c /etc/chirpstack
    volumes:
      - ./chirpstack/configuration/chirpstack:/etc/chirpstack
    ports:
      - "8080:8080" 
    depends_on:
      - chirpstack-postgres
      - chirpstack-redis
      - mqtt

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    profiles: ["lorawan"]
    container_name: chirpstack-rest-api
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack

