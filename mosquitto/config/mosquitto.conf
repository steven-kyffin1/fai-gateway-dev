# ==========================================
# 1. LOCAL EDGE SETTINGS (The "Store")
# ==========================================
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
log_dest file /mosquitto/log/mosquitto.log
listener 1883 0.0.0.0
allow_anonymous true

# ==========================================
# 2. CLOUD BRIDGE SETTINGS (The "Forward")
# ==========================================
connection cloud-backend-bridge

# REPLACE THIS with the actual URL or IP of your cloud MQTT broker
address mqtt.your-cloud-backend.com:1883 

# Cloud Authentication (Uncomment and fill in if your cloud requires a login)
# remote_username your_backend_user
# remote_password your_backend_password

# Clean session MUST be false for store-and-forward to work!
# This tells the cloud to remember this gateway if it drops offline.
cleansession false

# The exact topic pattern to forward to the cloud.
# "out" means send it from the Edge to the Cloud. 
# "1" is the QoS (Quality of Service), ensuring delivery.
topic gateway/# out 1 "" ""